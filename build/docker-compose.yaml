version: "3.8"

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: timestamp
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: timestampdb
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: ./build/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://timestamp:changeme@db:5432/timestampdb?sslmode=disable"
      PORT: "8080"
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  db-data:
